    const last = midPts[midPts.length - 1];
    d += ` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
    svg.appendChild(sv("path", { d, fill: "none", stroke: "var(--accentB)", "stroke-width": 2 }));
  }
  if (b.refIndex != null) {
    const rx = pad.l + (b.refIndex / bins.length) * pw;
    svg.appendChild(sv("line", { x1: rx, y1: pad.t, x2: rx, y2: pad.t + ph, stroke: "var(--danger)", "stroke-width": 1.6, "stroke-dasharray": "5 3" }));
    svg.appendChild(sv("text", { x: rx - 5, y: pad.t + 11, class: "chart-lbl-bold", "text-anchor": "end", fill: "var(--danger)" }, b.refLabel || "Limit"));
  }
  card.appendChild(svg);
  wrap.appendChild(card);
}

// 14. Donut Composition Ring + Interactive Legend
function renderDonut(b, wrap) {
  const card = makePanel(b.title || "Composition Breakdown", b.subtitle);
  const items = b.items || [];
  if (!items.length) { wrap.appendChild(card); return; }

  const total = items.reduce((a, x) => a + Number(x.value || 0), 0) || 1;
  const dw = el("div", "donut-wrap");
  const sbox = el("div", "donut-svg-box");
  const W = 200, H = 200, cx = 100, cy = 100, R = 82, rIn = 52;
  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Donut Chart" });

  let ang = -Math.PI / 2;
  const leg = el("div", "donut-leg");
  items.forEach((it, idx) => {
    const share = (it.value || 0) / total;
    const sweep = share * Math.PI * 2;
    const col = it.color || SERIES_COLORS[idx % SERIES_COLORS.length];
    const x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
    const x2 = cx + R * Math.cos(ang + sweep), y2 = cy + R * Math.sin(ang + sweep);
    const ix1 = cx + rIn * Math.cos(ang + sweep), iy1 = cy + rIn * Math.sin(ang + sweep);
    const ix2 = cx + rIn * Math.cos(ang), iy2 = cy + rIn * Math.sin(ang);
    const large = sweep > Math.PI ? 1 : 0;
    const d = `M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${ix1.toFixed(1)} ${iy1.toFixed(1)} A${rIn} ${rIn} 0 ${large} 0 ${ix2.toFixed(1)} ${iy2.toFixed(1)} Z`;
    const pct = Math.round(share * 100);
    const fmtVal = (b.unit === "$" || b.unit === "€" || b.unit === "£") ? `${b.unit}${Number(it.value).toLocaleString("en-US")}` : `${Number(it.value).toLocaleString("en-US")}${b.unit || ""}`;
    const info = Object.assign({ title: it.label, meta: `${fmtVal} (${pct}%)` }, it);

    const p = sv("path", { d, fill: col, stroke: "var(--surface)", "stroke-width": 2, class: "chart-pt", tabindex: 0, role: "button" });
    p.addEventListener("click", () => openItem(info));
    p.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(p);
    ang += sweep;

    const row = el("button", "donut-row"); row.type = "button";
    const left = el("span", "donut-row-l");
    const dot = el("i", "leg-dot"); dot.style.background = col;
    left.appendChild(dot); left.appendChild(document.createTextNode(it.label));
    row.appendChild(left);
    row.appendChild(el("span", "donut-row-r", `${fmtVal} · ${pct}%`));
    row.addEventListener("click", () => openItem(info));
    leg.appendChild(row);
  });

  svg.appendChild(sv("text", { x: cx, y: cy - 2, class: "chart-lbl-bold", "text-anchor": "middle", style: "font-size:20px" }, b.centerValue || String(total)));
  if (b.centerLabel) svg.appendChild(sv("text", { x: cx, y: cy + 16, class: "chart-lbl", "text-anchor": "middle" }, b.centerLabel));
  sbox.appendChild(svg);
  dw.appendChild(sbox);
  dw.appendChild(leg);
  card.appendChild(dw);
  wrap.appendChild(card);
}

// 15. Proportional Treemap (Recursive Balanced Split)
function renderTreemap(b, wrap) {
  const card = makePanel(b.title || "Proportional Treemap", b.subtitle);
  const items = [...(b.items || [])].sort((a, c) => c.value - a.value);
  if (!items.length) { wrap.appendChild(card); return; }

  const isFull = !wrap.classList.contains("block-grid");
  const W = isFull ? 900 : 560, H = isFull ? 250 : 220, total = items.reduce((a, x) => a + x.value, 0) || 1;
  const gMap = {};
  const rects = [];
  function layout(list, x, y, w, h) {
    if (!list.length) return;
    if (list.length === 1) { rects.push(Object.assign({ x, y, w, h }, list[0])); return; }
    const sum = list.reduce((a, it) => a + it.value, 0) || 1;
    let acc = 0, split = 1;
    for (let i = 0; i < list.length - 1; i++) {
      acc += list[i].value;
      split = i + 1;
      if (acc >= sum * 0.45) break;
    }
    const left = list.slice(0, split), right = list.slice(split);
    const ratio = left.reduce((a, it) => a + it.value, 0) / sum;
    if (w >= h) {
      layout(left, x, y, w * ratio, h);
      layout(right, x + w * ratio, y, w * (1 - ratio), h);
    } else {
      layout(left, x, y, w, h * ratio);
      layout(right, x, y + h * ratio, w, h * (1 - ratio));
    }
  }
  layout(items, 2, 2, W - 4, H - 4);

  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Treemap" });
  rects.forEach((r) => {
    const col = r.color || colorFor(r.group || r.label, gMap);
    const pct = Math.round((r.value / total) * 100);
    const g = sv("g", { class: "chart-pt", tabindex: 0, role: "button" });
    g.appendChild(sv("rect", { x: (r.x + 2).toFixed(1), y: (r.y + 2).toFixed(1), width: Math.max(4, r.w - 4).toFixed(1), height: Math.max(4, r.h - 4).toFixed(1), rx: 6, fill: col, "fill-opacity": 0.22, stroke: col, "stroke-width": 1.4 }));
    if (r.w > 64 && r.h > 32) {
      const maxCh = Math.max(6, Math.floor((r.w - 16) / 6.8));
      const lbl = r.label.length > maxCh ? r.label.slice(0, maxCh - 1) + "…" : r.label;
      g.appendChild(sv("text", { x: (r.x + 10).toFixed(1), y: (r.y + 20).toFixed(1), class: "chart-lbl-bold" }, lbl));
      if (r.h > 44) g.appendChild(sv("text", { x: (r.x + 10).toFixed(1), y: (r.y + 35).toFixed(1), class: "chart-lbl" }, `${r.value}${b.unit || ""} · ${pct}%`));
    }
    const info = Object.assign({ title: r.label, meta: `${r.value}${b.unit || ""} (${pct}%)${r.group ? " · " + r.group : ""}` }, r);
    g.addEventListener("click", () => openItem(info));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(g);
  });
  card.appendChild(svg);
  wrap.appendChild(card);
}

// 16. Conversion / Drop-Off Funnel
function renderFunnel(b, wrap) {
  const card = makePanel(b.title || "Conversion Funnel", b.subtitle);
  const stages = b.stages || [];
  if (!stages.length) { wrap.appendChild(card); return; }

  const isFull = !wrap.classList.contains("block-grid");
  const topV = stages[0].value || 1;
  const rowH = 50, W = isFull ? 820 : 540, pad = { l: 132, r: 96, t: 14, b: 14 }, H = pad.t + pad.b + stages.length * rowH;
  const pw = W - pad.l - pad.r, cx = pad.l + pw / 2;
  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Conversion Funnel" });

  stages.forEach((st, i) => {
    const y0 = pad.t + i * rowH + 3, y1 = y0 + rowH - 8;
    const minW = 104;
    const wTop = minW + (st.value / topV) * (pw - minW);
    const nextV = i < stages.length - 1 ? stages[i + 1].value : st.value * 0.88;
    const wBot = minW + (nextV / topV) * (pw - minW);
    const col = st.color || SERIES_COLORS[i % SERIES_COLORS.length];
    const pctTop = Math.round((st.value / topV) * 100);
    const stepPct = i > 0 ? Math.round((st.value / (stages[i - 1].value || 1)) * 100) : 100;
    const poly = `${(cx - wTop / 2).toFixed(1)},${y0} ${(cx + wTop / 2).toFixed(1)},${y0} ${(cx + wBot / 2).toFixed(1)},${y1} ${(cx - wBot / 2).toFixed(1)},${y1}`;

    const g = sv("g", { class: "chart-pt", tabindex: 0, role: "button" });
    g.appendChild(sv("text", { x: pad.l - 10, y: (y0 + y1) / 2 + 4, class: "chart-lbl-bold", "text-anchor": "end" }, st.label));
    g.appendChild(sv("polygon", { points: poly, fill: col, "fill-opacity": 0.24, stroke: col, "stroke-width": 1.6 }));
    g.appendChild(sv("text", { x: cx, y: (y0 + y1) / 2 + 4, class: "chart-lbl-bold", "text-anchor": "middle" }, `${st.value.toLocaleString("en-US")} (${pctTop}%)`));
    if (i > 0) {
      g.appendChild(sv("text", { x: pad.l + pw + 12, y: (y0 + y1) / 2 + 4, class: "chart-lbl", fill: stepPct < 55 ? "var(--danger)" : "var(--muted)" }, `↘ ${stepPct}% step`));
    }
    const info = Object.assign({ title: st.label, meta: `${st.value.toLocaleString()} · ${pctTop}% of top${i > 0 ? ` · ${stepPct}% from prev` : ""}` }, st);
    g.addEventListener("click", () => openItem(info));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(g);
  });
  card.appendChild(svg);
  wrap.appendChild(card);
}

// 17. Weighted Sankey / Alluvial Flow Diagram
function renderSankey(b, wrap) {
  const card = makePanel(b.title || "Weighted Flow (Sankey)", b.subtitle);
  const nodes = b.nodes || [], links = b.links || [];
  if (!nodes.length || !links.length) { wrap.appendChild(card); return; }

  const isFull = !wrap.classList.contains("block-grid");
  const W = isFull ? 900 : 560, H = 290, pad = { l: 12, r: 12, t: 24, b: 18 }, nodeW = 14, gap = 16;
  const byId = {};
  nodes.forEach((n, i) => { byId[n.id] = Object.assign({ inV: 0, outV: 0, inOff: 0, outOff: 0, col: n.col || 0, color: n.color || SERIES_COLORS[i % SERIES_COLORS.length] }, n); });
  links.forEach((lk) => {
    if (byId[lk.source]) byId[lk.source].outV += lk.value;
    if (byId[lk.target]) byId[lk.target].inV += lk.value;
  });

  const cols = {};
  Object.values(byId).forEach((n) => {
    n.val = Math.max(n.inV, n.outV, 1);
    (cols[n.col] = cols[n.col] || []).push(n);
  });
  const colKeys = Object.keys(cols).map(Number).sort((a, c) => a - c);
  const maxColSum = Math.max(...colKeys.map((k) => cols[k].reduce((a, n) => a + n.val, 0)));
  const maxNodes = Math.max(...colKeys.map((k) => cols[k].length));
  const scale = (H - pad.t - pad.b - gap * Math.max(0, maxNodes - 1)) / (maxColSum || 1);

  colKeys.forEach((ck, ci) => {
    const list = cols[ck];
    const colX = colKeys.length === 1 ? W / 2 : pad.l + (ci / (colKeys.length - 1)) * (W - pad.l - pad.r - nodeW);
    const totalH = list.reduce((a, n) => a + n.val * scale, 0) + gap * Math.max(0, list.length - 1);
    let y = pad.t + Math.max(0, (H - pad.t - pad.b - totalH) / 2);
    list.forEach((n) => {
      n.x = colX; n.y = y; n.h = Math.max(8, n.val * scale);
      y += n.h + gap;
    });
  });

  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Sankey Diagram" });
  links.forEach((lk) => {
    const s = byId[lk.source], t = byId[lk.target];
    if (!s || !t) return;
    const lh = Math.max(2, lk.value * scale);
    const y0 = s.y + s.outOff, y1 = t.y + t.inOff;
    s.outOff += lh; t.inOff += lh;
    const x0 = s.x + nodeW, x1 = t.x, mx = (x0 + x1) / 2;
    const d = `M${x0.toFixed(1)} ${y0.toFixed(1)} C${mx.toFixed(1)} ${y0.toFixed(1)}, ${mx.toFixed(1)} ${y1.toFixed(1)}, ${x1.toFixed(1)} ${y1.toFixed(1)} L${x1.toFixed(1)} ${(y1 + lh).toFixed(1)} C${mx.toFixed(1)} ${(y1 + lh).toFixed(1)}, ${mx.toFixed(1)} ${(y0 + lh).toFixed(1)}, ${x0.toFixed(1)} ${(y0 + lh).toFixed(1)} Z`;
    const p = sv("path", { d, fill: s.color, "fill-opacity": 0.30, class: "sankey-link", tabindex: 0, role: "button" });
    const info = Object.assign({ title: `${s.label} → ${t.label}`, meta: `Flow: ${lk.value}${b.unit ? " " + b.unit : ""}` }, lk);
    p.addEventListener("click", () => openItem(info));
    p.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(p);
  });

  const lastCol = colKeys[colKeys.length - 1];
  Object.values(byId).forEach((n) => {
    const g = sv("g", { class: "chart-pt", tabindex: 0, role: "button" });
    g.appendChild(sv("rect", { x: n.x.toFixed(1), y: n.y.toFixed(1), width: nodeW, height: n.h.toFixed(1), rx: 3, fill: n.color }));
    const isLast = n.col === lastCol && colKeys.length > 1;
    const isMid = n.col !== colKeys[0] && !isLast;
    const lx = isLast ? n.x - 6 : (isMid ? n.x + nodeW / 2 : n.x + nodeW + 6);
    const ly = isMid ? n.y - 5 : n.y + n.h / 2 + 4;
    const anchor = isLast ? "end" : (isMid ? "middle" : "start");
    g.appendChild(sv("text", { x: lx.toFixed(1), y: ly.toFixed(1), class: "chart-lbl-bold", "text-anchor": anchor }, `${n.label} (${n.val})`));
    const info = Object.assign({ title: n.label, meta: `Total volume: ${n.val}${b.unit ? " " + b.unit : ""}` }, n);
    g.addEventListener("click", () => openItem(info));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(g);
  });
  card.appendChild(svg);
  wrap.appendChild(card);
}

// 18. Timeline / Gantt Roadmap
function renderTimeline(b, wrap) {
  const card = makePanel(b.title || "Execution Timeline", b.subtitle);
  const tasks = b.tasks || [], axis = b.axis || [];
  if (!tasks.length) { wrap.appendChild(card); return; }

  const isFull = !wrap.classList.contains("block-grid");
  const maxT = axis.length || Math.max(...tasks.map((t) => t.end || 1));
  const rowH = 40, W = isFull ? 900 : 560, pad = { l: 146, r: 58, t: 28, b: 14 }, H = pad.t + pad.b + tasks.length * rowH;
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const sx = (v) => pad.l + (v / (maxT || 1)) * pw;

  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Gantt Timeline" });
  const cols = axis.length || Math.ceil(maxT);
  for (let i = 0; i <= cols; i++) {
    const gx = sx(i);
    svg.appendChild(sv("line", { x1: gx, y1: pad.t, x2: gx, y2: pad.t + ph, class: "chart-grid" }));
    if (i < cols && axis[i]) svg.appendChild(sv("text", { x: sx(i + 0.5), y: pad.t - 10, class: "chart-lbl", "text-anchor": "middle" }, axis[i]));
  }

  tasks.forEach((t, idx) => {
    const cy = pad.t + idx * rowH + rowH / 2;
    const x0 = sx(t.start || 0), x1 = sx(t.end || 1), w = Math.max(8, x1 - x0);
    const col = t.color || colorFor(t.tone || "accentA");
    const prog = Math.max(0, Math.min(1, t.progress != null ? t.progress : 1));
    const g = sv("g", { class: "chart-pt", tabindex: 0, role: "button" });
    g.appendChild(sv("text", { x: pad.l - 10, y: cy + 4, class: "chart-lbl-bold", "text-anchor": "end" }, t.label));
    g.appendChild(sv("rect", { x: x0.toFixed(1), y: cy - 9, width: w.toFixed(1), height: 18, rx: 5, fill: col, "fill-opacity": 0.22, stroke: col, "stroke-width": 1.4 }));
    if (prog > 0) g.appendChild(sv("rect", { x: x0.toFixed(1), y: cy - 9, width: (w * prog).toFixed(1), height: 18, rx: 5, fill: col, "fill-opacity": 0.78 }));
    g.appendChild(sv("text", { x: (x0 + w + 6).toFixed(1), y: cy + 4, class: "chart-lbl" }, `${Math.round(prog * 100)}%`));
    const info = Object.assign({ title: t.label, meta: `${t.group ? t.group + " · " : ""}${Math.round(prog * 100)}% complete` }, t);
    g.addEventListener("click", () => openItem(info));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(g);
  });

  if (b.today != null) {
    const tx = sx(b.today);
    svg.appendChild(sv("line", { x1: tx, y1: pad.t - 4, x2: tx, y2: pad.t + ph, stroke: "var(--danger)", "stroke-width": 1.6, "stroke-dasharray": "4 3" }));
    svg.appendChild(sv("text", { x: tx + 4, y: pad.t + 10, class: "chart-lbl-bold", fill: "var(--danger)" }, b.todayLabel || "Now"));
  }
  card.appendChild(svg);
  wrap.appendChild(card);
}

// 19. Bullet / SLO Target Gauge (Stephen Few Style)
function renderBullet(b, wrap) {
  const card = makePanel(b.title || "SLO Bullet Gauges", b.subtitle);
  const items = b.items || [];
  if (!items.length) { wrap.appendChild(card); return; }

  const isFull = !wrap.classList.contains("block-grid");
  const rowH = 48, W = isFull ? 900 : 540, pad = { l: 132, r: 84, t: 14, b: 14 }, H = pad.t + pad.b + items.length * rowH;
  const pw = W - pad.l - pad.r;
  const svg = sv("svg", { class: "chart-svg", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": b.title || "Bullet Chart" });

  items.forEach((it, idx) => {
    const cy = pad.t + idx * rowH + rowH / 2;
    const mx = it.max || Math.max(it.value, it.target || 0, ...(it.ranges || [100]));
    const sx = (v) => pad.l + (Math.max(0, Math.min(mx, v)) / (mx || 1)) * pw;
    const ranges = (it.ranges || [mx * 0.6, mx * 0.85, mx]).slice().sort((a, c) => c - a);
    const bandOp = [0.09, 0.16, 0.24];
    const g = sv("g", { class: "chart-pt", tabindex: 0, role: "button" });
    g.appendChild(sv("text", { x: pad.l - 10, y: cy + 4, class: "chart-lbl-bold", "text-anchor": "end" }, it.label));
    ranges.forEach((rv, ri) => {
      g.appendChild(sv("rect", { x: pad.l, y: cy - 11, width: Math.max(2, sx(rv) - pad.l).toFixed(1), height: 22, rx: 4, fill: "var(--ctl)", "fill-opacity": bandOp[ri] || 0.12 }));
    });
    const met = it.lowerIsBetter ? (it.value <= (it.target || mx)) : (it.value >= (it.target || 0));
    const col = it.color || (met ? "var(--ok)" : "var(--warn)");
    g.appendChild(sv("rect", { x: pad.l, y: cy - 5, width: Math.max(3, sx(it.value) - pad.l).toFixed(1), height: 10, rx: 3, fill: col }));
    if (it.target != null) {
      const tx = sx(it.target);
      g.appendChild(sv("line", { x1: tx.toFixed(1), y1: cy - 12, x2: tx.toFixed(1), y2: cy + 12, stroke: "var(--ink)", "stroke-width": 2.4 }));
    }
    g.appendChild(sv("text", { x: pad.l + pw + 10, y: cy + 4, class: "chart-lbl-bold", fill: col }, `${it.value}${it.unit || ""}`));
    const info = Object.assign({ title: it.label, meta: `Actual: ${it.value}${it.unit || ""}${it.target != null ? ` · Target: ${it.target}${it.unit || ""}` : ""}` }, it);
    g.addEventListener("click", () => openItem(info));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(info); } });
    svg.appendChild(g);
  });
  card.appendChild(svg);
  wrap.appendChild(card);
}

/* ==================== STANDARD COMPOSABLE BLOCKS ==================== */

function renderProfile(b, wrap) {
  const bar = el("div", "profile-strip");
  (b.items || b.profile || []).forEach((kv) => {
    const sp = el("span", "profile-item");
    const idx = kv.indexOf(":");
    if (idx > 0) {
      sp.appendChild(document.createTextNode(kv.slice(0, idx + 1)));
      sp.appendChild(el("strong", "", kv.slice(idx + 1).trim()));
    } else sp.textContent = kv;
    bar.appendChild(sp);
  });
  wrap.appendChild(bar);
}

function renderFlow(b, wrap) {
  (b.zones || []).forEach((z) => {
    const lane = el("section", "lane");
    const hdr = el("div", "lane-hdr");
    hdr.appendChild(el("span", "lane-title", z.title));
    if (z.note) hdr.appendChild(el("span", "lane-note", z.note));
    lane.appendChild(hdr);
    const row = el("div", "flow-row");
    (z.nodes || []).forEach((n, idx) => {
      if (idx > 0 && z.connected !== false) {
        const c = el("span", "connector"); c.appendChild(makeArrowSvg()); row.appendChild(c);
      }
      row.appendChild(makeNodeCard(n));
    });
    lane.appendChild(row);
    wrap.appendChild(lane);
  });
}

function renderPugh(b, wrap) {
  if (b.profile && b.profile.length) renderProfile({ items: b.profile }, wrap);
  const grid = el("div", "cards-grid");
  (b.options || []).forEach((opt) => {
    const c = el("button", "opt-card" + (opt.winner ? " winner" : ""));
    c.type = "button";
    c.setAttribute("data-item-id", opt.id || "");
    const hd = el("div", "opt-head");
    hd.appendChild(el("span", "node-title", opt.title));
    if (opt.tag) hd.appendChild(el("span", "opt-tag", opt.tag));
    c.appendChild(hd);
    if (opt.lead) c.appendChild(el("div", "node-sub", opt.lead));
    if (opt.scores && opt.scores.length) {
      const sum = opt.scores.reduce((a, s) => a + Number(s.val || 0), 0);
      c.appendChild(el("div", "opt-total", `Score: ${sum} / ${opt.scores.length * 5}`));
      const scBox = el("div", "scores");
      opt.scores.forEach((sc) => {
        const sr = el("div", "score-row");
        sr.appendChild(el("span", "", sc.label));
        const tr = el("div", "bar-track");
        const fl = el("div", "bar-fill"); fl.style.width = Math.max(0, Math.min(100, (sc.val / 5) * 100)) + "%";
        tr.appendChild(fl); sr.appendChild(tr); sr.appendChild(el("span", "score-val", String(sc.val)));
        scBox.appendChild(sr);
      });
      c.appendChild(scBox);
    }
    c.addEventListener("click", () => openItem(opt));
    grid.appendChild(c);
  });
  wrap.appendChild(grid);
  if (b.breakpoint) renderCallout({ label: "Breakpoint", text: b.breakpoint }, wrap);
}

const DEFAULT_TONES = ["win", "bet", "fill", "cut"];
const DEFAULT_BADGES = { win: "Do First", bet: "Spike / Stage", fill: "Optional", cut: "Avoid" };
function renderMatrix(b, wrap) {
  const grid = el("div", "quad-grid");
  (b.quadrants || []).forEach((qd, idx) => {
    const tone = qd.tone || DEFAULT_TONES[idx] || "fill";
    const box = el("section", "quad tone-" + tone);
    const hdr = el("div", "quad-hdr");
    const left = el("div", "quad-hdr-left");
    left.appendChild(el("h3", "", qd.title));
    if (qd.sub) left.appendChild(el("span", "quad-sub", qd.sub));
    hdr.appendChild(left);
    hdr.appendChild(el("span", "quad-pill", qd.badge || DEFAULT_BADGES[tone] || ""));
    box.appendChild(hdr);
    (qd.items || []).forEach((it) => box.appendChild(makeNodeCard(it)));
    grid.appendChild(box);
  });
  wrap.appendChild(grid);
}

function renderTable(b, wrap) {
  const card = makePanel(b.title, b.subtitle);
  const tw = el("div", "tbl-wrap");
  const tbl = el("table", "data-tbl");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  (b.columns || []).forEach((col, i) => hr.appendChild(el("th", (b.numericCols || []).includes(i) ? "num" : "", col)));
  thead.appendChild(hr); tbl.appendChild(thead);
  const tbody = document.createElement("tbody");
  (b.rows || []).forEach((r) => {
    const cells = Array.isArray(r) ? r : r.cells;
    const tr = el("tr", r.highlight ? "row-hl" : "");
    (cells || []).forEach((val, i) => tr.appendChild(el("td", (b.numericCols || []).includes(i) ? "num" : "", String(val))));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody); tw.appendChild(tbl); card.appendChild(tw);
  wrap.appendChild(card);
}

function renderWalkthrough(b, wrap) {
  const ba = el("div", "ba-grid");
  ["before", "after"].forEach((side) => {
    if (!b[side]) return;
    const col = el("section", "ba-col " + side);
    col.appendChild(el("h3", "ba-title", b[side].title || side.toUpperCase()));
    const ul = el("ul", "clean-ul");
    (b[side].items || []).forEach((t) => ul.appendChild(el("li", "", t)));
    col.appendChild(ul); ba.appendChild(col);
  });
  wrap.appendChild(ba);
  if (b.checks && b.checks.length) renderChecks({ title: "Verification Receipt Checks", items: b.checks }, wrap);
}

function renderChecks(b, wrap) {
  const sec = el("section", "check-section");
  if (b.title) sec.appendChild(el("h3", "sec-h", b.title));
  (b.items || b.checks || []).forEach((ck) => {
    const row = el("div", "check-item");
    row.appendChild(el("span", "", ck.label));
    row.appendChild(el("span", ck.verified ? "pill-ok" : "pill-warn", ck.verified ? "Verified" : "Unverified"));
    sec.appendChild(row);
  });
  wrap.appendChild(sec);
}

function renderCallout(b, wrap) {
  const box = el("div", "callout");
  if (b.label) box.appendChild(el("strong", "", b.label + " — "));
  box.appendChild(document.createTextNode(b.text || ""));
  wrap.appendChild(box);
}

function renderSlides(b, wrap) {
  const slides = b.slides || [];
  if (!slides.length) return;
  activeSlideIdx = Math.max(0, Math.min(slides.length - 1, activeSlideIdx));
  const s = slides[activeSlideIdx];
  const sw = el("div", "slide-wrap");
  const prog = el("div", "slide-progress");
  const fill = el("div", "slide-progress-fill");
  fill.style.width = (((activeSlideIdx + 1) / slides.length) * 100) + "%";
  prog.appendChild(fill); sw.appendChild(prog);
  const box = el("article", "slide-box");
  box.appendChild(el("span", "slide-num", `Slide ${activeSlideIdx + 1} of ${slides.length}`));
  box.appendChild(el("h2", "", s.title));
  if (s.lead) box.appendChild(el("p", "lead", s.lead));
  if (s.points && s.points.length) {
    const ul = el("ul", "clean-ul");
    s.points.forEach((pt) => ul.appendChild(el("li", "", pt)));
    box.appendChild(ul);
  }
  sw.appendChild(box);
  const nav = el("div", "slide-nav");
  const prev = el("button", "btn", "Previous"); prev.type = "button"; prev.disabled = activeSlideIdx === 0;
  prev.addEventListener("click", () => { activeSlideIdx--; renderView(); });
  const hint = el("span", "subtitle"); hint.appendChild(el("kbd", "", "←")); hint.appendChild(document.createTextNode(" ")); hint.appendChild(el("kbd", "", "→"));
  const next = el("button", "btn primary", "Next"); next.type = "button"; next.disabled = activeSlideIdx === slides.length - 1;
  next.addEventListener("click", () => { activeSlideIdx++; renderView(); });
  nav.appendChild(prev); nav.appendChild(hint); nav.appendChild(next);
  sw.appendChild(nav); wrap.appendChild(sw);
}

function renderBlock(b, container) {
  if (!b) return;
  if (b.type === "grid") {
    const g = el("div", "block-grid");
    g.style.setProperty("--cols", String(b.cols || 2));
    (b.blocks || []).forEach((child) => renderBlock(child, g));
    container.appendChild(g);
  } else if (b.type === "profile") renderProfile(b, container);
  else if (b.type === "flow") renderFlow(b, container);
  else if (b.type === "pugh" || b.type === "decision") renderPugh(b, container);
  else if (b.type === "matrix2x2") renderMatrix(b, container);
  else if (b.type === "quadrant-plot") renderQuadrantPlot(b, container);
  else if (b.type === "scatter") renderScatter(b, container);
  else if (b.type === "bell") renderBell(b, container);
  else if (b.type === "radar") renderRadar(b, container);
  else if (b.type === "heatmap") renderHeatmap(b, container);
  else if (b.type === "pareto") renderPareto(b, container);
  else if (b.type === "kpi") renderKpi(b, container);
  else if (b.type === "line") renderLine(b, container);
  else if (b.type === "bar") renderBar(b, container);
  else if (b.type === "waterfall") renderWaterfall(b, container);
  else if (b.type === "slope") renderSlope(b, container);
  else if (b.type === "boxplot") renderBoxplot(b, container);
  else if (b.type === "histogram") renderHistogram(b, container);
  else if (b.type === "donut") renderDonut(b, container);
  else if (b.type === "treemap") renderTreemap(b, container);
  else if (b.type === "funnel") renderFunnel(b, container);
  else if (b.type === "sankey") renderSankey(b, container);
  else if (b.type === "timeline") renderTimeline(b, container);
  else if (b.type === "bullet") renderBullet(b, container);
  else if (b.type === "table") renderTable(b, container);
  else if (b.type === "walkthrough") renderWalkthrough(b, container);
  else if (b.type === "checks") renderChecks(b, container);
  else if (b.type === "callout") renderCallout(b, container);
  else if (b.type === "slides") renderSlides(b, container);
}

function renderView() {
  const view = (BRIEF.views || [])[activeViewIdx];
  const canvas = $("canvas");
  canvas.textContent = "";
  closeInspector();
  if (!view) return;
  const wrap = el("div", "canvas-inner");
  const blocks = view.blocks || [view];
  blocks.forEach((b) => renderBlock(b, wrap));
  canvas.appendChild(wrap);
}

const tabs = $("tabs");
(BRIEF.views || []).forEach((v, idx) => {
  const b = el("button", "tab", v.label || v.id);
  b.type = "button";
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", String(idx === 0));
  b.addEventListener("click", () => {
    activeViewIdx = idx;
    tabs.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", String(j === idx)));
    renderView();
  });
  tabs.appendChild(b);
});

const isDarkNow = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  if (cur) return cur === "dark";
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches);
};
const paintThemeBtn = () => {
  const bt = $("btn-theme");
  bt.textContent = "";
  bt.appendChild(makeThemeSvg(isDarkNow()));
};

bo.addEventListener("click", () => {
  document.querySelectorAll(".selected").forEach((x) => x.classList.remove("selected"));
  const insp = openInspectorHeader("Open Decisions");
  insp.appendChild(el("p", "lead", "Review the options and context below, then reply directly in the main chat."));
  insp.appendChild(buildOpenCards(openItems, true));
});
$("btn-theme").addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", isDarkNow() ? "light" : "dark");
  paintThemeBtn();
});
window.addEventListener("themechange", paintThemeBtn);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeInspector();
  const view = (BRIEF.views || [])[activeViewIdx];
  const slideBlock = view && ((view.blocks || [view]).find((x) => x.type === "slides"));
  if (slideBlock) {
    if (e.key === "ArrowRight" && activeSlideIdx < (slideBlock.slides || []).length - 1) { activeSlideIdx++; renderView(); }
    if (e.key === "ArrowLeft" && activeSlideIdx > 0) { activeSlideIdx--; renderView(); }
  }
});

paintThemeBtn();
renderView();
})();
</script>
</body>
