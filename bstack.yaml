name: bstack
version: 0.5.0
author: Leonel Baltazar Bravo
description: >
  Personal agentic development skill stack organized by workflow stage:
  environment, onboarding, planning, building (ODD), delegation, debugging,
  review & QA (RDD), and cross-cutting tools.
license: MIT

layers:
  - id: environment
    title: Environment
    blurb: "DevEX, Organizational Knowledge MCP, persistent memory (Engram), deployments, private VMs, terminal proxies, versioning, and harnesses."
    skills:
      - environment

  - id: onboarding
    title: Onboarding
    blurb: "Fast codebase mapping for existing repos and guided seeding for new projects."
    skills:
      - onboarding

  - id: plan
    title: Plan & Decide
    blurb: "Measured domain-aware grilling with engineering frameworks and quarantined spikes before coding."
    skills:
      - grill
      - spike

  - id: build
    title: Build
    blurb: "Organic-Driven Development (ODD) execution with out-of-the-box observability/security and unified UI/UX."
    skills:
      - odd-build
      - uiux

  - id: delegate
    title: Delegate
    blurb: "Context-safe multi-agent orchestration, worktree isolation, and cross-family model routing."
    skills:
      - delegate

  - id: debug
    title: Debug
    blurb: "Systematic 4-phase root-cause investigation with tight feedback loops and automated git bisect."
    skills:
      - systematic-debugging

  - id: review
    title: Review & QA
    blurb: "Receipt-Driven Development (RDD): cross-model adversarial review, live behavioral QA, and fingerprint-bound receipts."
    skills:
      - adversarial-review
      - qa-verify

  - id: cross-cutting
    title: Cross-Cutting
    blurb: "Cognitive-load-reducing interactive visual briefs (desktop + mobile) and multi-family evolutionary optimization."
    skills:
      - visual-brief
      - evolve
