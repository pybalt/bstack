<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Brief</title>
<style>
:root{
  --bg:#F4F5F2; --zone:#E7ECE9; --surface:#FFFFFF; --raised:#FFFFFF;
  --ink:#16201D; --muted:#4B5954; --line:#CBD3CE; --ctl:#55645E;
  --accentA:#B84D14; --accentASoft:#FCEEE5;
  --accentB:#1D5C8A; --accentBSoft:#E7F2FA;
  --ok:#1B6B3A; --okSoft:#E7F6EC; --warn:#8F5B00; --warnSoft:#FEF4DC;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101514; --zone:#192320; --surface:#212E2A; --raised:#283732;
  --ink:#EAF0ED; --muted:#A8B7B1; --line:#384843; --ctl:#91A39C;
  --accentA:#F29559; --accentASoft:#362217;
  --accentB:#6DB8EE; --accentBSoft:#162B3A;
  --ok:#6ED395; --okSoft:#173122; --warn:#F2C66D; --warnSoft:#352A14;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101514; --zone:#192320; --surface:#212E2A; --raised:#283732;
  --ink:#EAF0ED; --muted:#A8B7B1; --line:#384843; --ctl:#91A39C;
  --accentA:#F29559; --accentASoft:#362217;
  --accentB:#6DB8EE; --accentBSoft:#162B3A;
  --ok:#6ED395; --okSoft:#173122; --warn:#F2C66D; --warnSoft:#352A14;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.head-title{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.subtitle{font-size:13px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tab,.btn{min-height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--ctl);background:var(--surface);color:var(--ink);font:600 13.5px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.tab:hover,.btn:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.workspace{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
.canvas{flex:1;min-width:0;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.zone-box{border:1.5px dashed var(--ctl);border-radius:14px;background:var(--zone);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.zone-hdr{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px}
.zone-lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.flow-row{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px}
.arrow-sep{display:flex;align-items:center;color:var(--ctl);font-weight:700;font-size:18px;user-select:none}
.node{position:relative;min-width:168px;max-width:250px;flex:1 1 180px;text-align:left;padding:12px 14px;border-radius:12px;border:1.75px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:64px}
.node.st-focus{border-width:3px}
.node.st-open{border-style:dashed}
.node.accent-a{border-color:var(--accentA);background:var(--accentASoft)}
.node.accent-b{border-color:var(--accentB);background:var(--accentBSoft)}
.node.selected{box-shadow:0 0 0 3px var(--ink)}
.node-kicker{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.node-title{font-size:15px;font-weight:600;line-height:1.25}
.node-sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.badge{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--bg);font:700 11.5px/22px var(--sans);text-align:center}
.profile-bar{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-radius:12px;background:var(--zone);border:1px solid var(--line);font-size:13px}
.profile-chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.opt-card{padding:16px;border-radius:14px;border:1.75px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:var(--ink)}
.opt-card.winner{border:2.5px solid var(--accentB);background:var(--accentBSoft)}
.opt-card.selected{box-shadow:0 0 0 3px var(--ink)}
.opt-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.opt-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--zone);color:var(--ink);border:1px solid var(--line)}
.opt-card.winner .opt-tag{background:var(--accentB);color:var(--bg);border-color:var(--accentB)}
.score-row{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:8px;font-size:12.5px}
.bar-track{height:8px;border-radius:99px;background:var(--zone);overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--ink);border-radius:99px}
.opt-card.winner .bar-fill{background:var(--accentB)}
.breakpoint{padding:12px 14px;border-radius:10px;border-left:4px solid var(--accentA);background:var(--accentASoft);font-size:13.5px}
.quad-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quad{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.quad h3{margin:0;font-size:14px;display:flex;justify-content:space-between;color:var(--ink)}
.quad-sub{font-size:12px;color:var(--muted);font-weight:500}
.ba-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ba-col{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px}
.ba-col.after{border-color:var(--ok);background:var(--okSoft)}
.check-list{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px}
.pill-ok{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--okSoft);color:var(--ok);border:1px solid var(--ok)}
.pill-warn{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warnSoft);color:var(--warn);border:1px solid var(--warn)}
.slide-box{max-width:860px;width:100%;margin:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:14px}
.slide-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
aside.inspector{width:380px;flex:none;border-left:1px solid var(--line);background:var(--raised);overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:12px}
aside.inspector[hidden]{display:none}
.insp-bar{position:sticky;top:-16px;margin:-16px -18px 0;padding:12px 14px 10px 18px;background:var(--raised);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.insp-bar h2{margin:0;font-size:17px;line-height:1.25}
.x-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--ctl);background:var(--surface);color:var(--ink);font:600 20px/1 var(--sans);cursor:pointer}
.lead{margin:0;font-size:14.5px;line-height:1.5}
.sec-h{margin:12px 0 4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.insp-ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px;line-height:1.45}
.ask{border-top:1px solid var(--line);padding-top:8px}
.ask summary{min-height:44px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-size:13.5px;font-weight:600;list-style:none}
.ask-ans{font-size:12.5px;color:var(--accentB);margin-top:2px}
.opt-radio{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13.5px;cursor:pointer}
.opt-radio input{width:18px;height:18px;accent-color:var(--ink)}
textarea.note,textarea.out{width:100%;font:14px/1.4 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--ctl);border-radius:10px;padding:10px;resize:vertical}
textarea.out{font-family:var(--mono);font-size:12.5px}
.dock{flex:none;min-height:60px;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.leg-item{display:inline-flex;align-items:center;gap:6px}
.leg-sw{width:16px;height:10px;border-radius:3px;border:2px solid var(--ink);display:inline-block;background:var(--surface)}
.leg-sw.focus{border-width:3px}
.leg-sw.open{border-style:dashed}
.leg-sw.a{border-color:var(--accentA);background:var(--accentASoft)}
.leg-sw.b{border-color:var(--accentB);background:var(--accentBSoft)}
.dock-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
@media (max-width:780px){
  header{padding:10px 12px;gap:8px}
  h1{font-size:16px}
  .tabs{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .tab{flex:none;white-space:nowrap}
  .node{max-width:none;width:100%;flex:1 1 100%}
  .quad-grid{grid-template-columns:1fr}
  .arrow-sep{transform:rotate(90deg);justify-content:center;width:100%;height:20px}
  .dock{padding:6px 10px}
  .legend{display:none}
  .dock-actions{width:100%;justify-content:flex-end}
  aside.inspector{position:fixed;left:8px;right:8px;bottom:68px;top:auto;width:auto;max-height:62vh;border:1.5px solid var(--ctl);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:20}
  .canvas{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="head-title">
    <h1 id="h-title">Visual Brief</h1>
    <div id="h-sub" class="subtitle">Click any card or node for details</div>
  </div>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Brief views"></nav>
</header>

<div class="workspace">
  <main id="canvas" class="canvas" tabindex="-1"></main>
  <aside id="inspector" class="inspector" aria-live="polite" hidden></aside>
</div>

<footer class="dock">
  <div id="legend" class="legend"></div>
  <div class="dock-actions">
    <button id="btn-pending" class="btn" type="button" hidden></button>
    <button id="btn-theme" class="btn" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</footer>

<script>
(function(){
// <DATA>
const BRIEF = {
  "id": "visual-brief-template-v1",
  "title": "Sample Visual Brief",
  "subtitle": "3-level progressive disclosure · desktop & mobile",
  "views": [
    {
      "id": "flow",
      "label": "System Flow",
      "type": "flow",
      "zones": [
        {
          "title": "Main Pipeline",
          "nodes": [
            {
              "id": "n1",
              "kicker": "Stage 1",
              "title": "Input Gate",
              "sub": "Validates request",
              "status": "base",
              "accent": "b",
              "lead": "Validates incoming payloads at the boundary and assigns a correlation ID.",
              "details": [
                {"heading": "Measured", "items": ["p95 validation latency under 2ms.", "Rejects malformed payloads with 400."]}
              ],
              "open": [
                {"q": "Strict mode on unknown fields?", "op": ["Reject unknown fields (Recommended)", "Strip silently", "Pass through"]}
              ]
            },
            {
              "id": "n2",
              "kicker": "Stage 2",
              "title": "Core Engine",
              "sub": "Processes work",
              "status": "focus",
              "accent": "a",
              "lead": "Executes business rules idempotently and emits structured audit telemetry.",
              "details": [
                {"heading": "Observability", "items": ["Emits JSON logs with correlation_id.", "Tracks RED metrics and failure codes."]}
              ]
            }
          ]
        }
      ]
    }
  ]
};
// </DATA>

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

document.title = BRIEF.title || "Visual Brief";
$("h-title").textContent = BRIEF.title || "Visual Brief";
$("h-sub").textContent = BRIEF.subtitle || "";

const LSK = "visual-brief:" + (BRIEF.id || "default");
let resp = {};
try { resp = JSON.parse(localStorage.getItem(LSK) || "{}") || {}; } catch (e) {}

const pending = [];
const byId = {};
(BRIEF.views || []).forEach((v) => {
  const collect = (item) => {
    if (!item || !item.id) return;
    byId[item.id] = item;
    (item.open || []).forEach((o, idx) => {
      const q = typeof o === "string" ? o : o.q;
      const op = typeof o === "string" ? [] : (o.op || []);
      pending.push({ key: item.id + "#" + idx, item, q, op });
    });
  };
  (v.zones || []).forEach((z) => (z.nodes || []).forEach(collect));
  (v.nodes || []).forEach(collect);
  (v.options || []).forEach(collect);
  (v.quadrants || []).forEach((qd) => (qd.items || []).forEach(collect));
  (v.cards || []).forEach(collect);
});

const getAns = (p) => {
  const r = resp[p.key];
  if (!r) return "";
  return r.o >= 0 ? (p.op[r.o] || "") : (r.t || "").trim();
};
const countPendingFor = (itemId) => pending.filter((p) => p.item.id === itemId && !getAns(p)).length;
const saveResp = () => {
  try { localStorage.setItem(LSK, JSON.stringify(resp)); } catch (e) {}
  updateBadges();
};

const formatResponses = () => {
  const lines = ['Responses for "' + (BRIEF.title || "Visual Brief") + '":', ""];
  let n = 0;
  pending.forEach((p) => {
    const v = getAns(p);
    if (v) {
      n++;
      lines.push(n + ". [" + (p.item.title || p.item.id) + "] " + p.q + " -> " + v);
    }
  });
  return lines.join("\n");
};

let activeViewIdx = 0;
let activeSlideIdx = 0;
let selectedId = null;

function updateBadges() {
  const answered = pending.filter((p) => !!getAns(p)).length;
  const bp = $("btn-pending");
  if (!pending.length) {
    bp.hidden = true;
  } else {
    bp.hidden = false;
    bp.textContent = "Pending (" + answered + "/" + pending.length + ")";
  }
  document.querySelectorAll("[data-badge-for]").forEach((b) => {
    const n = countPendingFor(b.getAttribute("data-badge-for"));
    b.textContent = String(n);
    b.hidden = n === 0;
  });
  document.querySelectorAll(".copy-resp-btn").forEach((b) => {
    b.disabled = answered === 0;
    b.textContent = "Copy responses (" + answered + "/" + pending.length + ")";
  });
}

function buildAskList(list, showOwner) {
  const frag = document.createDocumentFragment();
  list.forEach((p) => {
    const det = el("details", "ask");
    const sum = el("summary");
    if (showOwner) sum.appendChild(el("span", "node-kicker", p.item.title || p.item.id));
    sum.appendChild(el("span", "", p.q));
    const ansEl = el("span", "ask-ans");
    sum.appendChild(ansEl);
    det.appendChild(sum);

    const ta = el("textarea", "note");
    ta.rows = 2;
    ta.placeholder = "Write custom response...";
    const r = resp[p.key] || {};
    ta.value = r.t || "";

    const paint = () => {
      const v = getAns(p);
      ansEl.textContent = v ? "Selected: " + v : "";
    };

    const addRadio = (idx, labelText) => {
      const lb = el("label", "opt-radio");
      const inp = document.createElement("input");
      inp.type = "radio";
      inp.name = "q_" + p.key;
      inp.checked = r.o === idx;
      inp.addEventListener("change", () => {
        resp[p.key] = { o: idx, t: ta.value };
        ta.hidden = idx >= 0;
        saveResp();
        paint();
        if (idx < 0) ta.focus();
      });
      lb.appendChild(inp);
      lb.appendChild(document.createTextNode(labelText));
      det.appendChild(lb);
    };

    p.op.forEach((optTxt, i) => addRadio(i, optTxt));
    if (p.op.length) {
      addRadio(-1, "Other (custom note)");
      ta.hidden = r.o !== -1;
    }
    ta.addEventListener("input", () => {
      resp[p.key] = { o: -1, t: ta.value };
      saveResp();
      paint();
    });
    det.appendChild(ta);
    paint();
    frag.appendChild(det);
  });

  const copyBtn = el("button", "btn primary copy-resp-btn");
  copyBtn.type = "button";
  const out = el("textarea", "out");
  out.rows = 5;
  out.readOnly = true;
  out.hidden = true;
  copyBtn.addEventListener("click", () => {
    const txt = formatResponses();
    out.value = txt;
    const onCopied = () => {
      out.hidden = true;
      copyBtn.textContent = "Copied!";
      setTimeout(updateBadges, 1400);
    };
    const fallback = () => {
      out.hidden = false;
      out.focus();
      out.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(onCopied, fallback);
    } else {
      fallback();
    }
  });
  frag.appendChild(copyBtn);
  frag.appendChild(out);
  return frag;
}

function closeInspector() {
  selectedId = null;
  $("inspector").hidden = true;
  document.querySelectorAll(".selected").forEach((x) => x.classList.remove("selected"));
}

function openInspectorHeader(title) {
  const insp = $("inspector");
  insp.textContent = "";
  const bar = el("div", "insp-bar");
  bar.appendChild(el("h2", "", title));
  const xb = el("button", "x-btn", "×");
  xb.type = "button";
  xb.setAttribute("aria-label", "Close inspector");
  xb.addEventListener("click", closeInspector);
  bar.appendChild(xb);
  insp.appendChild(bar);
  insp.hidden = false;
  return insp;
}

function openItem(item) {
  selectedId = item.id;
  document.querySelectorAll(".selected").forEach((x) => x.classList.remove("selected"));
  const dom = document.querySelector('[data-item-id="' + item.id + '"]');
  if (dom) dom.classList.add("selected");

  const insp = openInspectorHeader(item.title || item.id);
  if (item.kicker || item.status) {
    insp.appendChild(el("div", "node-kicker", [item.kicker, item.status].filter(Boolean).join(" · ")));
  }
  if (item.lead) insp.appendChild(el("p", "lead", item.lead));

  const itemPending = pending.filter((p) => p.item.id === item.id);
  const hasMore = (item.details && item.details.length) || itemPending.length;
  if (hasMore) {
    const moreBtn = el("button", "btn", "More detail" + (itemPending.length ? " · " + itemPending.length + " open" : ""));
    moreBtn.type = "button";
    moreBtn.addEventListener("click", () => {
      moreBtn.remove();
      (item.details || []).forEach((grp) => {
        insp.appendChild(el("h3", "sec-h", grp.heading || "Details"));
        const ul = el("ul", "insp-ul");
        (grp.items || []).forEach((it) => ul.appendChild(el("li", "", it)));
        insp.appendChild(ul);
      });
      if (itemPending.length) {
        insp.appendChild(el("h3", "sec-h", "Open Decisions"));
        insp.appendChild(buildAskList(itemPending, false));
        updateBadges();
      }
    });
    insp.appendChild(moreBtn);
  }
}

function openPendingDrawer() {
  selectedId = null;
  document.querySelectorAll(".selected").forEach((x) => x.classList.remove("selected"));
  const insp = openInspectorHeader("Open Decisions");
  insp.appendChild(el("p", "lead", "Pick your decisions below, then copy all answers back into chat."));
  insp.appendChild(buildAskList(pending, true));
  updateBadges();
}

function makeNodeCard(n) {
  const b = el("button", "node st-" + (n.status || "base") + (n.accent ? " accent-" + n.accent : ""));
  b.type = "button";
  b.setAttribute("data-item-id", n.id);
  if (n.kicker) b.appendChild(el("span", "node-kicker", n.kicker));
  b.appendChild(el("span", "node-title", n.title));
  if (n.sub) b.appendChild(el("span", "node-sub", n.sub));
  if (n.open && n.open.length) {
    const bd = el("span", "badge");
    bd.setAttribute("data-badge-for", n.id);
    b.appendChild(bd);
  }
  b.addEventListener("click", () => openItem(n));
  return b;
}

function renderFlow(view, canvas) {
  (view.zones || []).forEach((z) => {
    const box = el("section", "zone-box");
    const hdr = el("div", "zone-hdr");
    hdr.appendChild(el("span", "zone-lbl", z.title));
    if (z.note) hdr.appendChild(el("span", "subtitle", z.note));
    box.appendChild(hdr);
    const row = el("div", "flow-row");
    (z.nodes || []).forEach((n, idx) => {
      if (idx > 0 && z.connected !== false) row.appendChild(el("span", "arrow-sep", "→"));
      row.appendChild(makeNodeCard(n));
    });
    box.appendChild(row);
    canvas.appendChild(box);
  });
}

function renderDecision(view, canvas) {
  if (view.profile && view.profile.length) {
    const bar = el("div", "profile-bar");
    view.profile.forEach((kv) => bar.appendChild(el("span", "profile-chip", kv)));
    canvas.appendChild(bar);
  }
  const grid = el("div", "cards-grid");
  (view.options || []).forEach((opt) => {
    const c = el("button", "opt-card" + (opt.winner ? " winner" : ""));
    c.type = "button";
    c.setAttribute("data-item-id", opt.id);
    const hd = el("div", "opt-head");
    hd.appendChild(el("span", "node-title", opt.title));
    if (opt.tag) hd.appendChild(el("span", "opt-tag", opt.tag));
    c.appendChild(hd);
    if (opt.lead) c.appendChild(el("div", "node-sub", opt.lead));
    (opt.scores || []).forEach((sc) => {
      const sr = el("div", "score-row");
      sr.appendChild(el("span", "", sc.label));
      const tr = el("div", "bar-track");
      const fl = el("div", "bar-fill");
      fl.style.width = Math.max(0, Math.min(100, (sc.val / 5) * 100)) + "%";
      tr.appendChild(fl);
      sr.appendChild(tr);
      sr.appendChild(el("strong", "", sc.val + "/5"));
      c.appendChild(sr);
    });
    c.addEventListener("click", () => openItem(opt));
    grid.appendChild(c);
  });
  canvas.appendChild(grid);
  if (view.breakpoint) canvas.appendChild(el("div", "breakpoint", "Breakpoint: " + view.breakpoint));
}

function renderMatrix(view, canvas) {
  const grid = el("div", "quad-grid");
  (view.quadrants || []).forEach((qd) => {
    const box = el("section", "quad");
    const h = el("h3");
    h.appendChild(document.createTextNode(qd.title));
    if (qd.sub) h.appendChild(el("span", "quad-sub", qd.sub));
    box.appendChild(h);
    (qd.items || []).forEach((it) => box.appendChild(makeNodeCard(it)));
    grid.appendChild(box);
  });
  canvas.appendChild(grid);
}

function renderWalkthrough(view, canvas) {
  const ba = el("div", "ba-grid");
  ["before", "after"].forEach((side) => {
    if (!view[side]) return;
    const col = el("section", "ba-col " + side);
    col.appendChild(el("h3", "sec-h", view[side].title || side.toUpperCase()));
    const ul = el("ul", "insp-ul");
    (view[side].items || []).forEach((t) => ul.appendChild(el("li", "", t)));
    col.appendChild(ul);
    ba.appendChild(col);
  });
  canvas.appendChild(ba);
  if (view.checks && view.checks.length) {
    const cl = el("section", "check-list");
    cl.appendChild(el("h3", "sec-h", "Verification Status (RDD)"));
    view.checks.forEach((ck) => {
      const row = el("div", "check-item");
      row.appendChild(el("span", "", ck.label));
      row.appendChild(el("span", ck.verified ? "pill-ok" : "pill-warn", ck.verified ? "VERIFIED" : "UNVERIFIED"));
      cl.appendChild(row);
    });
    canvas.appendChild(cl);
  }
}

function renderSlides(view, canvas) {
  const slides = view.slides || [];
  if (!slides.length) return;
  activeSlideIdx = Math.max(0, Math.min(slides.length - 1, activeSlideIdx));
  const s = slides[activeSlideIdx];
  const box = el("article", "slide-box");
  box.appendChild(el("span", "node-kicker", "Slide " + (activeSlideIdx + 1) + " of " + slides.length));
  box.appendChild(el("h2", "", s.title));
  if (s.lead) box.appendChild(el("p", "lead", s.lead));
  if (s.points && s.points.length) {
    const ul = el("ul", "insp-ul");
    s.points.forEach((pt) => ul.appendChild(el("li", "", pt)));
    box.appendChild(ul);
  }
  const nav = el("div", "slide-nav");
  const prev = el("button", "btn", "← Previous");
  prev.type = "button";
  prev.disabled = activeSlideIdx === 0;
  prev.addEventListener("click", () => { activeSlideIdx--; renderView(); });
  const next = el("button", "btn primary", "Next →");
  next.type = "button";
  next.disabled = activeSlideIdx === slides.length - 1;
  next.addEventListener("click", () => { activeSlideIdx++; renderView(); });
  nav.appendChild(prev);
  nav.appendChild(next);
  box.appendChild(nav);
  canvas.appendChild(box);
}

function renderView() {
  const view = (BRIEF.views || [])[activeViewIdx];
  const canvas = $("canvas");
  canvas.textContent = "";
  closeInspector();
  if (!view) return;
  if (view.type === "flow") renderFlow(view, canvas);
  else if (view.type === "decision") renderDecision(view, canvas);
  else if (view.type === "matrix2x2") renderMatrix(view, canvas);
  else if (view.type === "walkthrough") renderWalkthrough(view, canvas);
  else if (view.type === "slides") renderSlides(view, canvas);
  updateBadges();
}

const tabs = $("tabs");
(BRIEF.views || []).forEach((v, idx) => {
  const b = el("button", "tab", v.label || v.id);
  b.type = "button";
  b.setAttribute("role", "tab");
  b.setAttribute("aria-selected", String(idx === 0));
  b.addEventListener("click", () => {
    activeViewIdx = idx;
    tabs.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", String(j === idx)));
    renderView();
  });
  tabs.appendChild(b);
});

const legend = $("legend");
[["", "Existing / Base"], ["focus", "Key Focus"], ["open", "Open Decision"], ["a", "Track A"], ["b", "Track B / Recommended"]].forEach(([cls, txt]) => {
  const s = el("span", "leg-item");
  s.appendChild(el("i", "leg-sw" + (cls ? " " + cls : "")));
  s.appendChild(document.createTextNode(txt));
  legend.appendChild(s);
});

$("btn-pending").addEventListener("click", openPendingDrawer);
$("btn-theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme:dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (prefersDark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeInspector();
  const view = (BRIEF.views || [])[activeViewIdx];
  if (view && view.type === "slides") {
    if (e.key === "ArrowRight" && activeSlideIdx < (view.slides || []).length - 1) { activeSlideIdx++; renderView(); }
    if (e.key === "ArrowLeft" && activeSlideIdx > 0) { activeSlideIdx--; renderView(); }
  }
});

renderView();
})();
</script>
</body>
</html>
