name: bstack
version: 0.1.0
author: Leonel Baltazar Bravo
description: >
  Stack personal de skills de desarrollo ordenado por etapa: environment,
  onboarding, planificacion, construccion, delegacion, depuracion y revision.
license: MIT

layers:
  - id: environment
    title: Environment
    blurb: "DevEX, Org-Knowledge MCP, Deployments, VM, Terminal, Versioning y Harness."
    skills:
      - environment

  - id: onboarding
    title: Onboarding
    blurb: "Mapeo real de repos existentes y arranque guiado de proyectos nuevos."
    skills:
      - onboarding

  - id: plan
    title: Entender antes de escribir
    blurb: "Leer el terreno, experimentar rapido y aislar la causa antes de tocar codigo."
    skills:
      - plan
      - spike
      - systematic-debugging

  - id: construir
    title: Construir
    blurb: "TDD, portado fiel de librerias y stack unificado de UI/UX y motion."
    skills:
      - test-driven-development
      - portado-fiel-de-libreria
      - uiux

  - id: delegar
    title: Delegar a CLIs de codigo
    blurb: "Cuando conviene delegar ejecucion: que CLI usar y con que encargo."
    skills:
      - claude-code
      - codex
      - opencode
      - cursor-orchestration

  - id: depurar
    title: Depurar
    blurb: "Cuando algo no cierra: debugger real y analisis de causa raiz."
    skills:
      - node-inspect-debugger
      - python-debugpy
      - rea-reverse-engineering

  - id: revisar
    title: Revisar y verificar
    blurb: "Revision de calidad, simplificacion y verificacion con evidencia ejecutada."
    skills:
      - requesting-code-review
      - simplify-code
      - verification-before-completion
