<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI Variants Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #f5f5f7; color: #111; }
    header { max-width: 1440px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: baseline; }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    .grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #fff; border: 1px solid #e2e2e6; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .meta { padding: 12px 14px; border-bottom: 1px solid #ececf0; }
    .meta strong { display: block; font-size: 14px; }
    .meta span { font-size: 12px; color: #555; }
    iframe { width: 100%; height: 420px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Design Variants Comparison</h1>
    <span>Replace iframe src values with local variant paths</span>
  </header>
  <main class="grid">
    <section class="card">
      <div class="meta"><strong>001 · Conservative</strong><span>Axis: baseline / familiar density</span></div>
      <iframe src="./001-variant/index.html" title="Variant 001"></iframe>
    </section>
    <section class="card">
      <div class="meta"><strong>002 · Strong-fit</strong><span>Axis: primary direction</span></div>
      <iframe src="./002-variant/index.html" title="Variant 002"></iframe>
    </section>
    <section class="card">
      <div class="meta"><strong>003 · Divergent</strong><span>Axis: structural exploration</span></div>
      <iframe src="./003-variant/index.html" title="Variant 003"></iframe>
    </section>
  </main>
</body>
</html>
